<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modern Weather App</title>

  <link rel="stylesheet" href="style.css">

  <!-- ICONS -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <div class="container">

    <!-- SIDEBAR -->

    <div class="sidebar">

      <div class="logo">
        <i class="fa-solid fa-cloud"></i>
      </div>

      <div class="menu active">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </div>

      <div class="menu">
        <i class="fa-solid fa-calendar"></i>
        <span>Forecast</span>
      </div>

      <div class="menu">
        <i class="fa-solid fa-map"></i>
        <span>Map</span>
      </div>

      <div class="menu">
        <i class="fa-solid fa-heart"></i>
        <span>Favorites</span>
      </div>

      <div class="menu">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </div>

    </div>

    <!-- MAIN -->

    <div class="main">

      <!-- SEARCH -->

      <div class="search-box">

        <input type="text"
        id="searchInput"
        placeholder="Search city...">

        <button id="searchBtn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

      </div>

      <!-- TOP -->

      <div class="top">

        <div>

          <h1 id="city">Casablanca</h1>

          <p id="date"></p>

        </div>

        <div class="temp">
          <span id="temp">24</span>°C
        </div>

      </div>

      <!-- MAIN CARD -->

      <div class="weather-card">

        <div class="left">

          <h2 id="condition">Partly Cloudy</h2>

          <p>
            Feels like
            <span id="feels">25</span>°C
          </p>

          <div class="details">

            <div class="detail-box">
              <i class="fa-solid fa-droplet"></i>
              <span id="humidity">60%</span>
            </div>

            <div class="detail-box">
              <i class="fa-solid fa-wind"></i>
              <span id="wind">14 km/h</span>
            </div>

            <div class="detail-box">
              <i class="fa-solid fa-gauge"></i>
              <span id="pressure">1012 hPa</span>
            </div>

          </div>

        </div>

        <div class="right">

          <img id="icon"
          src="https://openweathermap.org/img/wn/02d@4x.png">

        </div>

      </div>

      <!-- HOURLY -->

      <div class="hourly-card">

        <h3>Hourly Forecast</h3>

        <div class="hourly" id="hourly"></div>

      </div>

      <!-- BOTTOM -->

      <div class="bottom-grid">

        <!-- DAYS -->

        <div class="days-card">

          <h3>7-Day Forecast</h3>

          <div id="days"></div>

        </div>

        <!-- AIR -->

        <div class="air-card">

          <h3>Air Quality</h3>

          <div class="circle">
            42
          </div>

          <p>Good</p>

          <div class="sun-info">

            <div>🌅 Sunrise : 06:12</div>

            <div>🌇 Sunset : 20:14</div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="main.js"></script>

</body>
</html>
